version: "3.8"

networks:
  cluster_net:
    driver: overlay  # Use bridge for single-node Pi

volumes:
  grafana_data:
  backup_data:
  logs_data:

services:
  # Backend Django API
  pushgateway:
    image: prom/pushgateway:latest
    networks:
      - cluster_net
    ports:
      - "9091:9091"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  backend:
    image: cluster_backend:latest  # prebuilt ARM64 image
    networks:
      - cluster_net
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    depends_on:
      - sensor_exporter

  # Sensor Exporter
  sensor_exporter:
    image: cluster_sensor_exporter:latest
    networks:
      - cluster_net
    ports:
      - "9200:9200"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    networks:
      - cluster_net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    depends_on:
      - sensor_exporter
      - backend

  # Grafana
  grafana:
    image: arm64v8/grafana:9.7.2  # ARM64 Grafana
    networks:
      - cluster_net
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    depends_on:
      - prometheus

  # Backup Service
  backup_service:
    image: cluster_backup_service:latest
    networks:
      - cluster_net
    volumes:
      - backup_data:/mnt/backup
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Disk Health Monitoring
  disk_health:
    image: cluster_disk_health:latest  # prebuilt ARM64 image
    networks:
      - cluster_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Log Aggregator
  log_aggregator:
    image: cluster_log_aggregator:latest
    networks:
      - cluster_net
    volumes:
      - logs_data:/var/log
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Cluster Manager
  cluster_manager:
    image: cluster_manager:latest  # prebuilt ARM64 image
    networks:
      - cluster_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Test / Stress container
  test_stress:
    image: cluster_test_stress:latest
    networks:
      - cluster_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
